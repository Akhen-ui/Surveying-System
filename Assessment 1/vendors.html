<!DOCTYPE html>
<html>
<head>
    <title>Vendor Registration</title>
</head>
<body>

    <h1>Public Market Vendor Registration</h1>

    <!-- FORM -->
    <form action="/add_vendor" method="POST">
        <label>Full Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Stall Number:</label><br>
        <input type="text" name="stall" required><br><br>

        <label>Business Type:</label><br>
        <input type="text" name="business" required><br><br>

        <button type="submit">Register Vendor</button>
    </form>

    <hr>

    <!-- DISPLAY VENDORS -->
    <h2>Registered Vendors</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Stall</th>
            <th>Business</th>
        </tr>

        {% for v in vendors %}
        <tr>
            <td>{{ v.id }}</td>
            <td>{{ v.name }}</td>
            <td>{{ v.stall }}</td>
            <td>{{ v.business }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
